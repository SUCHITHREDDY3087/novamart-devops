# =============================================================================
# NovaMart 3-Tier Multi-Container Orchestration (compose.yaml)
# Tier 1 (Nginx Web), Tier 2 (Flask API), Tier 3 (MySQL 8)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Tier 3: Relational Database (MySQL 8)
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: novamart-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-novamart_secure_root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_db}
      MYSQL_USER: ${MYSQL_USER:-ecommerce_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-novamart_secure_user_pass}
    volumes:
      # Persistent volume to ensure orders & data persist after container restart
      - mysql_data:/var/lib/mysql
      # Initial SQL schema & seed catalog executed on first startup
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - ecommerce-network

  # ---------------------------------------------------------------------------
  # Tier 2: Application Logic (Python Flask REST API)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novamart-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_db}
      MYSQL_USER: ${MYSQL_USER:-ecommerce_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-novamart_secure_user_pass}
      PORT: 5000
      FLASK_ENV: ${FLASK_ENV:-production}
      CORS_ORIGIN: "*"
      SECRET_KEY: ${SECRET_KEY:-change_me_before_deployment}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ecommerce-network

  # ---------------------------------------------------------------------------
  # Tier 1: Web Presentation & Reverse Proxy (Alpine Nginx)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novamart-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - ecommerce-network

# -----------------------------------------------------------------------------
# Named Volumes for Database Persistence
# -----------------------------------------------------------------------------
volumes:
  mysql_data:
    driver: local

# -----------------------------------------------------------------------------
# Internal Bridge Network for Isolated Inter-Container Communication
# -----------------------------------------------------------------------------
networks:
  ecommerce-network:
    driver: bridge
